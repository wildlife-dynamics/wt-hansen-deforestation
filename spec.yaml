id: hansen_deforestation

requirements:
  # DEV ONLY: ecoscope-platform stays a normal published conda dependency
  # here even though we're testing unpublished code (trend-analysis multi-
  # model tasks, branch feat/trend-analysis-multi-model-tasks) - the
  # unpublished branch is shadowed in via PYTHONPATH at compile/run time
  # instead of listed here as an editable-local requirement (see
  # home-range's spec.yaml history, commit 75ad164, for the same pattern).
  # A plain `path:`/`editable: true` requirement forces a mixed conda+pypi
  # solve that's both slower and fragile (e.g. the conda solver picks a
  # pydantic version that then conflicts with ecoscope's own pip-side
  # pydantic<2.9.0 pin, and pip falls back to building pyproj from source).
  # The published ecoscope-platform conda package avoids all of this since
  # its own dependency closure already includes statsmodels/bambi/pyproj
  # etc. as plain conda packages with a correct pydantic<2.9.0 pin baked in.
  #
  # Compile and run with:
  #   PYTHONPATH=/absolute/path/to/local/ecoscope ./dev/recompile.sh
  #   PYTHONPATH=/absolute/path/to/local/ecoscope pixi run <workflow CLI/tests>
  #
  # Revert to a plain published pin (no PYTHONPATH needed) once a released
  # ecoscope-platform version actually contains this code.
  - name: ecoscope-platform
    version: ">=2.18.0,<3.0.0"
    channel: https://repo.prefix.dev/ecoscope-workflows/

  - name: pydeck
    version: "0.9.2"
    channel: conda-forge

  # Without these, conda resolves an old arviz/arviz-plots pair (0.23.4/0.8.0
  # as observed) that's incompatible with the matplotlib version also
  # resolved here (arviz_plots.__init__ calls the private
  # matplotlib.style.core API, removed in newer matplotlib) - breaks GAMM
  # (any of the 4 trend models) on `import bambi` with
  # AttributeError: module 'matplotlib.style' has no attribute 'core'.
  # Pinning arviz alone then breaks the old bambi/pymc conda resolves too
  # (they still call arviz.concat, removed in arviz>=1.0) - so bambi/pymc
  # need bumping in step with arviz. Versions here match a verified-working
  # combo (ecoscope's own dev environment, via pip).
  - name: arviz
    version: ">=1.0.0"
    channel: conda-forge
  - name: arviz-plots
    version: ">=1.0.0"
    channel: conda-forge
  - name: bambi
    version: ">=0.20.0"
    channel: conda-forge
  - name: pymc
    version: ">=6.0.0"
    channel: conda-forge

rjsf-overrides:
  $defs:
    ValueGrouper.properties.index_name.oneOf:
      [{ "const": "name", "title": "Region of Interest" }]

    LocalFileSpatialFeatures.properties.file_path.default: ""
    # groupers.index_name is already locked to a single fixed "Region of
    # Interest" choice below (always the "name" column), and
    # load_spatial_features_group renames whatever column this points to
    # into a fixed "name" output column regardless - so there's no real
    # choice for the user to make here either. Fix it the same way, rather
    # than just defaulting it to an editable "name" they could mismatch
    # against groupers and silently break grouping.
    LocalFileSpatialFeatures.properties.name_column.default: "name"
    LocalFileSpatialFeatures.properties.layer.type: ["string", "null"]
    RemoteFileSpatialFeatures.properties.url.default: ""
    RemoteFileSpatialFeatures.properties.name_column.default: "name"
    RemoteFileSpatialFeatures.properties.layer.type: ["string", "null"]
  properties:
    groupers.properties.groupers.items.anyOf:
      - "$ref": "#/$defs/ValueGrouper"

    groupers.properties.groupers.default:
      - "index_name": "name"

    roi.properties.config.anyOf:
      [
        { "$ref": "#/$defs/LocalFileSpatialFeatures" },
        { "$ref": "#/$defs/RemoteFileSpatialFeatures" },
      ]

    hansen_image.properties.var.default: "UMD/hansen/global_forest_change_2024_v1_12"
    hansen_image.properties.var.description: "Hansen Global Forest Change dataset image name."

    Forest Analysis.properties.tree_cover_threshold.properties.var.title: "Tree Cover Threshold"
    Forest Analysis.properties.tree_cover_threshold.properties.var.default: 60.0
    Forest Analysis.properties.tree_cover_threshold.properties.var.description: >-
      Minimum tree cover percentage (0-100) to classify a pixel as forest.
    Forest Analysis.properties.tree_cover_threshold.properties.var.minimum: 0.0
    Forest Analysis.properties.tree_cover_threshold.properties.var.maximum: 100.0

    Dashboard.properties.map_widget_title.properties.var.title: "Map Title"
    Dashboard.properties.map_widget_title.properties.var.default: "Forest Change Map"
    Dashboard.properties.map_widget_title.properties.var.description: "Title displayed on the forest change map."

    Dashboard.properties.chart_widget_title.properties.var.title: "Trend Chart Title"
    Dashboard.properties.chart_widget_title.properties.var.default: "Forest Cover Trend Chart"
    Dashboard.properties.chart_widget_title.properties.var.description: "Title displayed on the forest cover trend chart."

    time_range.properties.since.default: "2000-01-01T00:00:00.000Z"
    time_range.properties.since.description: >-
      Start year of the analysis. The Hansen dataset baseline always starts from 2000.
    time_range.properties.until.description: >-
      End year of the analysis. Depends on the Hansen dataset selected
      (e.g. UMD/hansen/global_forest_change_2024_v1_12 covers up to 2024).
  uiSchema:
    # name_column is fixed to "name" (see the $defs override above) and
    # never a real per-workflow choice - hide it so users just point at a
    # file/URL without also needing to know which column holds region
    # names. Positional, matching roi.config.anyOf's order: LocalFile, RemoteFile.
    roi.config.anyOf:
      - name_column:
          ui:widget: hidden
      - name_column:
          ui:widget: hidden

    # Hide each variant's own redundant fieldset title (repeats what the
    # Trend Model dropdown itself already shows selected), each wrapper
    # field's own title (see the $defs overrides above) so only the inner
    # field's normal-sized label shows, and the variant's own `model` const
    # field entirely (ui:widget: hidden, not just label:false - it's a fixed,
    # non-editable value that just repeats the dropdown selection, carrying
    # no real choice to preserve - matches home-range's own treatment of the
    # analogous auto_scale_or_custom const field). Positional, matching
    # TrendModel's union order: LinearTrendModel, GlmTrendModel, GamTrendModel, GammTrendModel.
    Trend Analysis.trend_model.model.anyOf:
      - ui:options:
          label: false
        model:
          ui:widget: hidden
        intercept_settings:
          ui:options:
            label: false
      - ui:options:
          label: false
        model:
          ui:widget: hidden
        family_settings:
          ui:options:
            label: false
        intercept_settings:
          ui:options:
            label: false
      - ui:options:
          label: false
        model:
          ui:widget: hidden
        family_settings:
          ui:options:
            label: false
        smoothing_settings:
          ui:options:
            label: false
        spline_settings:
          ui:options:
            label: false
        bounds_settings:
          ui:options:
            label: false
      - ui:options:
          label: false
        model:
          ui:widget: hidden
        family_settings:
          ui:options:
            label: false
        spline_settings:
          ui:options:
            label: false
        mcmc_settings:
          ui:options:
            label: false

task-instance-defaults:
  skipif:
    conditions:
      - any_is_empty_df
      - any_dependency_skipped

workflow:
  - name: Set Workflow Details
    id: workflow_details
    task: set_workflow_details

  - name: Connect to Earth Engine
    id: gee_project_name
    task: set_gee_connection

    # The time range is set based on the temporal coverage of the
    # UMD/hansen/global_forest_change_2024_v1_12 dataset (2000–2024).
  - name: Time Range
    id: time_range
    task: set_time_range
    partial:
      time_format: "%Y"

  - name: Hansen Dataset
    id: hansen_image
    task: set_string_var

  - name: Set Groupers
    id: groupers
    task: set_groupers

  - name: Load Region of Interest
    id: roi
    task: load_spatial_features_group

  - name: ""
    id: split_roi_groups
    task: split_groups
    partial:
      df: ${{ workflow.roi.return }}
      groupers: ${{ workflow.groupers.return }}

  - title: Forest Analysis
    type: task-group
    description: ""
    tasks:
      - name: ""
        id: tree_cover_threshold
        task: set_float_var

      - name: ""
        id: forest_cover_trends
        task: extract_forest_cover_trends
        partial:
          client: ${{ workflow.gee_project_name.return }}
          time_range: ${{ workflow.time_range.return }}
          image: ${{ workflow.hansen_image.return }}
          tree_cover_threshold: ${{ workflow.tree_cover_threshold.return }}
        mapvalues:
          argnames: aoi
          argvalues: ${{ workflow.split_roi_groups.return }}

  - name: ""
    id: persist_forest_cover_data
    task: persist_df_wrapper
    skipif:
      conditions:
        - never
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      sanitize: true
      filename_prefix: forest_cover
      filetypes:
        - parquet
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.forest_cover_trends.return }}

  - name: ""
    id: forest_layers
    task: create_forest_layers
    partial:
      client: ${{ workflow.gee_project_name.return }}
      time_range: ${{ workflow.time_range.return }}
      image: ${{ workflow.hansen_image.return }}
      tree_cover_threshold: ${{ workflow.tree_cover_threshold.return }}
      opacity: 1.0
    mapvalues:
      argnames: aoi
      argvalues: ${{ workflow.split_roi_groups.return }}

  - name: Base Maps
    id: base_map_defs
    task: set_base_maps

  - name: ""
    id: merged_forest_layers
    task: merge_tile_layers
    partial:
      base_layers: ${{ workflow.base_map_defs.return }}
    mapvalues:
      argnames: overlay
      argvalues: ${{ workflow.forest_layers.return }}

  - name: ""
    id: roi_layer
    task: create_polygon_layer_pydeck
    partial:
      data_url: null
      layer_style:
        filled: false
        stroked: true
        get_line_color: [127, 201, 127, 255]
        get_line_width: 1
      legend:
        title: ROI Boundary
        values:
          - label: ROI Boundary
            color: rgba(127, 201, 127, 1)
    mapvalues:
      argnames: geodataframe
      argvalues: ${{ workflow.split_roi_groups.return }}

  - name: ""
    id: combined_forest_map_layers
    task: groupbykey
    partial:
      iterables:
        - ${{ workflow.merged_forest_layers.return }}
        - ${{ workflow.roi_layer.return }}

  - name: ""
    id: forest_map
    task: draw_map
    partial:
      title: null
      static: false
      output_type: "html"
      max_zoom: 20
      view_state: null
      legend_style: null
    mapvalues:
      argnames: [tile_layers, geo_layers]
      argvalues: ${{ workflow.combined_forest_map_layers.return }}

  - name: ""
    id: persist_forest_map
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: map
      text: ${{ workflow.forest_map.return }}
    mapvalues:
      argnames: text
      argvalues: ${{ workflow.forest_map.return }}

  - title: Trend Analysis
    type: task-group
    description: >-
      Choose a trend model and configure its fitting parameters.
    tasks:
      - name: ""
        id: trend_model
        task: set_trend_model

      # GAMM fits once across every region's combined data (a real random
      # effect needs multiple sites in one fit; see GammTrendModel's own
      # docstring), unlike the other 3 models which each fit independently
      # per region - so it gets its own combined-fit branch below, gated by
      # is_gamm_trend_model/is_not_gamm_trend_model so exactly one of the
      # two fit branches actually runs for any given model selection. Both
      # branches' resulting per-region predictions (trend_predictions /
      # trend_predictions_gamm) are then merged back into one series per
      # region via trend_predictions_merged/_final, so everything
      # downstream (chart, persist, widget) is unaware of the branching.
      - name: ""
        id: trend_fit
        task: fit_trend_model
        skipif:
          conditions:
            - any_is_empty_df
            - any_dependency_skipped
            - is_gamm_trend_model
        partial:
          time_column: "year"
          value_column: "cumsum_loss_pct"
          model: ${{ workflow.trend_model.return }}
        mapvalues:
          argnames: dataframe
          argvalues: ${{ workflow.forest_cover_trends.return }}

      - name: ""
        id: trend_predictions
        task: predict_trend_model
        partial:
          time_column: "time"
          value_column: "value"
          time_values: null
          include_ci: true
        mapvalues:
          argnames: model_params
          argvalues: ${{ workflow.trend_fit.return }}

      - name: ""
        id: forest_cover_trends_combined
        task: concat_dataframes
        partial:
          dfs: ${{ workflow.forest_cover_trends.return }}
          ensure_columns: ["year", "loss_area", "cumsum_loss_area", "survival_area", "cumsum_loss_pct", "name"]
          reset_index: true

      - name: ""
        id: trend_fit_combined
        task: fit_trend_model
        skipif:
          conditions:
            - any_is_empty_df
            - any_dependency_skipped
            - is_not_gamm_trend_model
        partial:
          dataframe: ${{ workflow.forest_cover_trends_combined.return }}
          time_column: "year"
          value_column: "cumsum_loss_pct"
          model: ${{ workflow.trend_model.return }}

      - name: ""
        id: trend_predictions_gamm
        task: predict_trend_model
        partial:
          model_params: ${{ workflow.trend_fit_combined.return }}
          time_column: "year"
          value_column: "cumsum_loss_pct"
          time_values: null
          include_ci: true
        mapvalues:
          argnames: dataframe
          argvalues: ${{ workflow.forest_cover_trends.return }}

      - name: ""
        id: trend_predictions_merged
        task: groupbykey_passthrough_skip
        partial:
          iterables:
            - ${{ workflow.trend_predictions.return }}
            - ${{ workflow.trend_predictions_gamm.return }}

      - name: ""
        id: trend_predictions_final
        task: concat_dataframes
        partial:
          ensure_columns: []
          reset_index: true
        mapvalues:
          argnames: dfs
          argvalues: ${{ workflow.trend_predictions_merged.return }}

      - name: ""
        id: persist_trend_data
        task: persist_df_wrapper
        skipif:
          conditions:
            - never
        partial:
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          sanitize: true
          filename_prefix: trend_predictions
          filetypes:
            - parquet
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.trend_predictions_final.return }}

      - name: Trend Chart
        id: forest_cover_chart
        task: draw_historic_timeseries
        partial:
          current_value_column: "y"
          time_column: "time"
          current_value_title: "Observed Trend"
          historic_min_column: "ci_lower"
          historic_max_column: "ci_upper"
          historic_mean_column: "predicted"
          historic_mean_title: "Trend Estimate"
          historic_band_title: "Trend Confidence"
          layout_style:
            xaxis:
              title: "Year"
            yaxis:
              title: "Cumulative Forest Loss (% of Original)"
          upper_lower_band_style:
            mode: lines
            line:
              color: green
          historic_mean_style: null
          current_value_style: null
        mapvalues:
          argnames: dataframe
          argvalues: ${{ workflow.trend_predictions_final.return }}

      - name: ""
        id: persist_forest_cover
        task: persist_text
        partial:
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          text: ${{ workflow.forest_cover_chart.return }}
        mapvalues:
          argnames: text
          argvalues: ${{ workflow.forest_cover_chart.return }}

  - title: Dashboard
    type: task-group
    description: Configure the dashboard output titles.
    tasks:
      - name: ""
        id: map_widget_title
        task: set_string_var

      - name: ""
        id: chart_widget_title
        task: set_string_var

  - name: ""
    id: forest_map_widget
    task: create_map_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: ${{ workflow.map_widget_title.return }}
    map:
      argnames: [view, data]
      argvalues: ${{ workflow.persist_forest_map.return }}

  - name: ""
    id: grouped_forest_map
    task: merge_widget_views
    skipif:
      conditions:
        - never
    partial:
      widgets: ${{ workflow.forest_map_widget.return }}

  - name: ""
    id: forest_cover_widget
    task: create_plot_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: ${{ workflow.chart_widget_title.return }}
    map:
      argnames: [view, data]
      argvalues: ${{ workflow.persist_forest_cover.return }}

  - name: ""
    id: grouped_forest_cover
    task: merge_widget_views
    skipif:
      conditions:
        - never
    partial:
      widgets: ${{ workflow.forest_cover_widget.return }}

  - name: ""
    id: gamm_dashboard
    task: gather_dashboard
    partial:
      details: ${{ workflow.workflow_details.return }}
      time_range: ${{ workflow.time_range.return }}
      widgets:
        - ${{ workflow.grouped_forest_map.return }}
        - ${{ workflow.grouped_forest_cover.return }}
      groupers: ${{ workflow.groupers.return }}
